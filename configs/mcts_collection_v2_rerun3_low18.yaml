# MCTS v2 Rerun 3 — 18 tasks still with <15 successes after 3 rounds
#
# Run this config 3 times with different output dirs to get 336 runs per task:
#   Round A: output_dir = checkpoints/mcts_trajectories_v2/rerun3a_low18
#   Round B: output_dir = checkpoints/mcts_trajectories_v2/rerun3b_low18
#   Round C: output_dir = checkpoints/mcts_trajectories_v2/rerun3c_low18
#
# Usage:
#   sudo -E python scripts/mcts/run_mcts_collection.py \
#       --config configs/mcts_collection_v2_rerun3_low18.yaml

# ---- VMs (112 total: 32 + 16 + 32 + 32) ----
vms_per_task: 112
max_active_vms: 112
tasks_per_batch: 1

# ---- Env servers ----
remote_server_urls:
  - "http://10.100.4.4:15001"
  - "http://10.100.4.6:15001"
  - "http://10.100.4.8:15001"
  - "http://10.100.4.7:15001"
remote_server_env_counts: [32, 16, 32, 32]

# ---- Probing ----
probe_temperature: 1.0
total_probe_budget: 96
k_max: 64

# ---- Branching ----
spatial_grid_size: 50
min_cluster_size: 1
max_branch_per_explorer: 4
child_branch_budget: 4
max_branches_per_step: 2
never_branch_after: 15
late_step_threshold: 10

# ---- Replay ----
replay_pause_sec: 1.0

# ---- Pruning ----
stuck_repeat_limit: 3
stuck_wait_limit: 2

# ---- Pipeline ----
max_steps: 15

# ---- GPU / Inference ----
model_path: "ByteDance-Seed/UI-TARS-1.5-7B"
tp: 8
gpu_memory_utilization: 0.85
max_model_len: 12000
limit_images: 3
generation_max_tokens: 512

# ---- Tree saving (v2) ----
save_full_tree: true

# ---- Task file ----
task_file: "OSWorld/evaluation_examples/test_18tasks_rerun3.json"

# ---- Output (change for each round: rerun3a, rerun3b, rerun3c) ----
output_dir: "checkpoints/mcts_trajectories_v2/rerun3c_low18"
