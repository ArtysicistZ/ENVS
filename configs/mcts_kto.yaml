# MCTS KTO — Full KTO (Paper Eq. 7) with z_ref EMA baseline
#
# Uses the full KTO loss with reference model anchoring and KL baseline.
# z_ref estimated via running EMA across batches (needed for batch_size=1).
# Desirable: 1 - sigmoid(beta * (log_ratio - z_ref)) — push policy prob UP
# Undesirable: 1 - sigmoid(beta * (z_ref - log_ratio)) — push policy prob DOWN
# Difficulty weighting: (1-SR)^β / T_t with separate pos/neg pools.
#
# Usage:
#   torchrun --nproc_per_node=8 scripts/train_mcts_kto.py \
#       --config configs/mcts_kto.yaml

# ---- Model ----
model_path: "ByteDance-Seed/UI-TARS-1.5-7B"
ref_model_path: "ByteDance-Seed/UI-TARS-1.5-7B"
freeze_vision_tower: true
bf16: true

# ---- Data ----
tree_dir: "checkpoints/mcts_trajectories_v2/combined_all/trees"
task_index_path: "checkpoints/mcts_trajectories_v2/combined_all/task_index.json"
mask_path: "checkpoints/mcts_trajectories_v2/combined_all/step_masks_v2.json"
sr_path: "checkpoints/mcts_trajectories_v2/combined_all/mcts_success.jsonl"
negatives_path: "checkpoints/mcts_kto/kto_negatives_all.jsonl"
max_length: 12000
limit_images: 3

# ---- KTO ----
kto_beta: 3.0             # Calibrated for AVERAGE log-probs to match SFT grad_norm (~2.0)
neg_gradient_ratio: 0.15   # Fraction of total gradient from negatives (0.15 = 15% neg, 85% pos)
z_ref_momentum: 0.99       # EMA momentum for KL baseline (z_ref in paper Eq. 7)

# ---- Weighting ----
difficulty_beta: 0.5       # Power exponent for positive difficulty weighting
max_step_ratio: 2.0        # Cap per-step weight at 2x mean

# ---- Training ----
output_dir: "checkpoints/mcts_kto/v3_fixed_beta01_1e-6"
num_epochs: 1
per_device_batch_size: 1
gradient_accumulation_steps: 4    # effective_batch = 32
learning_rate: 2e-6
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
logging_steps: 1

# ---- Infrastructure ----
fsdp_offload: false
