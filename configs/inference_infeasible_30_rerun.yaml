# Rerun all 30 infeasible tasks with fail() action added to prompt
# 30 tasks × 8 rollouts = 240 entries, 16 local VMs → 15 batches
#
# Run: sudo python -m verl.trainer.main config=configs/inference_infeasible_30_rerun.yaml

data:
  train_files: OSWorld/evaluation_examples/test_infeasible_30.json
  val_files: OSWorld/evaluation_examples/test_infeasible_30.json
  val_n_repeats: 8
  prompt_key: instruction
  answer_key: ""
  image_key: images
  max_prompt_length: 32000
  max_response_length: 1024
  rollout_batch_size: 8
  val_batch_size: -1
  shuffle: true
  seed: 1
  max_pixels: 2116800
  min_pixels: 256

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0
  enable_replay: false

worker:
  actor:
    global_batch_size: 8
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: ByteDance-Seed/UI-TARS-1.5-7B
      enable_gradient_checkpointing: false
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: false
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    temperature: 1.0
    n: 8
    gpu_memory_utilization: 0.4
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 8
    max_num_batched_tokens: 34000
    max_num_seqs: 4
    old_logprob_source: "recompute"
    val_override_config:
      temperature: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 16
  max_steps: 15
  remote_server_urls:
    - "http://10.100.4.6:15001"
  remote_server_env_counts: [16]

trainer:
  total_episodes: 1
  logger: ["console"]
  project_name: arpo-inference
  experiment_name: infeasible_30_rerun
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: true
  val_only: true
