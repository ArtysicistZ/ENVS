# Full ARPO Training with v4 Noise Curriculum — 8x A100-80GB + 96 Remote Envs + 86 Tasks
#
# v4 noise pipeline:
#   - synchronized noise within GRPO group (CRN, seed = (task_id, training_step))
#   - deterministic SR→count mapping replaces probabilistic dice
#       SR ≥ 0.50 → 3-5 fires per rollout
#       SR 0.25–0.50 → 1-3 fires
#       SR 0.10–0.25 → exactly 1 fire
#       SR < 0.10 → 0 fires (very_hard task: protect training signal)
#   - bucket-spaced random fire-step indices (no clumping)
#   - adaptive: live curriculum EMA SR drives the bucket lookup
#
# Topology: 2 env_servers × 48 slots each = 96 envs.
#   10.100.4.6:15001 (slots 0-47)
#   10.100.4.8:15001 (slots 0-47)
#
# Run: bash scripts/training/run_arpo_8gpu_noise_full.sh

data:
  train_files: OSWorld/evaluation_examples/test_86tasks_trainable.json
  val_files: OSWorld/evaluation_examples/test_86tasks_trainable.json
  prompt_key: instruction
  answer_key: ""
  image_key: images
  max_prompt_length: 12000
  max_response_length: 1024
  rollout_batch_size: 12
  val_batch_size: -1
  shuffle: true
  seed: 42
  max_pixels: 2116800
  min_pixels: 256

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0
  enable_replay: true
  # ─── v4 noise ───────────────────────────────────────────────────────────
  enable_noise: true
  noise_mode: runtime_library
  # `noise_probability` is vestigial in v4 (scheduler ignores it); kept for
  # logging / back-compat. Curriculum's per-task tier/p are still tracked.
  noise_probability: 0.10
  noise_probability_min: 0.0
  noise_probability_max: 0.20
  noise_initial_tier: 2
  # Adaptive curriculum: EMA SR drives the SR→count lookup so noise count
  # tracks the agent's improving capability across training steps.
  noise_use_curriculum: true
  noise_target_sr: 0.5
  noise_tau_up: 0.6
  noise_tau_down: 0.15
  noise_k_up: 3
  noise_ema_alpha: 0.3
  noise_recovery_ema_alpha: 0.2
  noise_lr: 0.05
  noise_tier_min: 0
  noise_tier_max: 5
  noise_use_heldout: false

worker:
  actor:
    global_batch_size: 12
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: ByteDance-Seed/UI-TARS-1.5-7B
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: false
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    temperature: 1.0
    n: 8
    gpu_memory_utilization: 0.4
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 3
    max_num_batched_tokens: 13024
    max_num_seqs: 8
    old_logprob_source: "recompute"
    val_override_config:
      temperature: 0.5
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 96
  max_steps: 15
  remote_server_urls:
    - "http://10.100.4.6:15001"
    - "http://10.100.4.8:15001"
  remote_server_env_counts: [48, 48]

trainer:
  total_episodes: 20
  logger: ["console", "wandb"]
  project_name: OSWorld-ARPO
  experiment_name: arpo_86tasks_v4_noise_8xa100
  wandb_entity: hanszhu05
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: false
  val_freq: -1
  save_freq: 5
  save_limit: -1
