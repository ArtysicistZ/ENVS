# MCTS v2 Sweep 4 — 86 trainable tasks, 72 VMs (2 servers), 8 GPUs
#
# Two fresh rounds (sweep4a, sweep4b) to add trajectory diversity.
# Uses only the 2 reachable servers (4.4: 32 VMs, 4.8: 40 VMs).
#
# Usage:
#   sudo -E .venv/bin/python scripts/mcts/run_mcts_collection.py \
#       --config configs/mcts_collection_v2_sweep4.yaml
#
#   Or use the wrapper:
#   bash scripts/mcts/run_sweep4_2rounds.sh

# ---- VMs (72 total: 32 + 40) ----
vms_per_task: 72
max_active_vms: 72
tasks_per_batch: 1

# ---- Env servers (only reachable ones) ----
remote_server_urls:
  - "http://10.100.4.4:15001"
  - "http://10.100.4.8:15001"
remote_server_env_counts: [32, 40]

# ---- Probing ----
probe_temperature: 1.0
total_probe_budget: 64
k_max: 64

# ---- Branching ----
spatial_grid_size: 50
min_cluster_size: 1
max_branch_per_explorer: 4
child_branch_budget: 4
max_branches_per_step: 2
never_branch_after: 15
late_step_threshold: 10

# ---- Replay ----
replay_pause_sec: 1.0

# ---- Pruning ----
stuck_repeat_limit: 3
stuck_wait_limit: 2

# ---- Pipeline ----
max_steps: 15

# ---- GPU / Inference ----
model_path: "ByteDance-Seed/UI-TARS-1.5-7B"
tp: 8
gpu_memory_utilization: 0.85
max_model_len: 12000
limit_images: 3
generation_max_tokens: 512

# ---- Tree saving (v2) ----
save_full_tree: true

# ---- Task file ----
task_file: "OSWorld/evaluation_examples/test_86tasks_trainable.json"

# ---- Output (updated per round by wrapper script) ----
output_dir: "checkpoints/mcts_trajectories_v2/sweep4a"
