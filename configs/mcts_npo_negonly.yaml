# NPO Negative-Only: fine-tune SFT v2.1 to avoid wrong actions
# NPO loss (arxiv:2404.05868 Eq. 3):
#   L = (2/β) × log(1 + exp(β × avg_per_token_log(π_θ/π_ref)))
# Gradient: W = 2σ(β×log_ratio) — 1.0 at init, →0 when unlearned, →2.0 when still wrong
#
# Usage:
#   torchrun --nproc_per_node=8 scripts/train_mcts_kto.py \
#       --config configs/mcts_npo_negonly.yaml

# ---- Model ----
model_path: "ArtysicistZ/UI-TARS-MCTS-V2-7B"
ref_model_path: "ArtysicistZ/UI-TARS-MCTS-V2-7B"
freeze_vision_tower: true
bf16: true

# ---- Data ----
tree_dir: "checkpoints/mcts_trajectories_v2/combined_all/trees"
task_index_path: "checkpoints/mcts_trajectories_v2/combined_all/task_index.json"
mask_path: "checkpoints/mcts_trajectories_v2/combined_all/step_masks_v2.json"
sr_path: "checkpoints/mcts_trajectories_v2/combined_all/mcts_success.jsonl"
negatives_path: "checkpoints/mcts_kto/kto_negatives_all.jsonl"
negatives_only: true
max_length: 12000
limit_images: 3

# ---- NPO ----
trainer_type: "npo"
npo_beta: 1.0

# ---- Weighting ----
difficulty_beta: 0.5
max_step_ratio: 2.0

# ---- Training ----
output_dir: "checkpoints/mcts_npo/sftv21_negonly_sum_beta1_1ep"
num_epochs: 1            # 1 epoch = 47 steps ≈ 7.4% of SFT v2.1's gradient budget
per_device_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2e-6
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
logging_steps: 1

# ---- Infrastructure ----
fsdp_offload: false
