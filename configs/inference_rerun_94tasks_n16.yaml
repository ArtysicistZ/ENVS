# Rerun: 94 tasks x 16 rollouts
# Tasks: ARPO-doable but 0 success, dense-model-success but 0 success,
#         low trajectory tasks (1-2 saved), wrongly deleted task (5ea617a3)
# False positive tasks excluded.
#
# Run: sudo -E /home/kevinzyz/yincheng/arpo/.venv/bin/python -m verl.trainer.main config=configs/inference_rerun_94tasks_n16.yaml

data:
  train_files: OSWorld/evaluation_examples/rerun_94tasks.json  # unused but must be valid
  val_files: OSWorld/evaluation_examples/rerun_94tasks.json
  val_n_repeats: 16  # 94 tasks x 16 = 1504 rollouts
  prompt_key: instruction
  answer_key: ""
  image_key: images
  max_prompt_length: 12000
  max_response_length: 1024
  rollout_batch_size: 8
  val_batch_size: -1
  shuffle: true
  seed: 42
  max_pixels: 2116800
  min_pixels: 256

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0
  enable_replay: false

worker:
  actor:
    global_batch_size: 8
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: ByteDance-Seed/UI-TARS-1.5-7B
      enable_gradient_checkpointing: false
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: false
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    temperature: 1.0
    n: 16
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 3
    max_num_batched_tokens: 14000
    max_num_seqs: 8
    old_logprob_source: "recompute"
    val_override_config:
      temperature: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 64
  max_steps: 15
  remote_server_urls:
    - "http://10.100.4.7:15001"
    - "http://10.100.4.6:15001"
    - "http://10.100.4.8:15001"
  remote_server_env_counts: [24, 16, 24]

trainer:
  total_episodes: 1
  logger: ["console"]
  project_name: arpo-inference
  experiment_name: rerun_94tasks_n16
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: true
  val_only: true
  save_checkpoint_path: checkpoints/arpo-inference/rerun_94tasks_n16
  save_trajectories: true
