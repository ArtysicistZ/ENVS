# MCTS SFT v2.1 — Fixed weighted loss + Per-Step Deduplicated, Power-Scaled Weighting
#
# v2.1 fixes:
#   - Weight bug: .mean() instead of .sum()/.sum() (weights cancelled with batch_size=1)
#   - Gradient clipping preserves weighted gradient DIRECTION — no change needed
#   - max_step_ratio: 10→3 (tighter per-sample cap prevents overfitting on very-hard tasks)
#
# Usage:
#   torchrun --nproc_per_node=8 scripts/train_mcts_sft_v2.py \
#       --config configs/mcts_sft_v2.1.yaml

# ---- Model ----
model_path: "ByteDance-Seed/UI-TARS-1.5-7B"
freeze_vision_tower: true
bf16: true

# ---- Data (v2 tree-based) ----
tree_dir: "checkpoints/mcts_trajectories_v2/combined_all/trees"
task_index_path: "checkpoints/mcts_trajectories_v2/combined_all/task_index.json"
mask_path: "checkpoints/mcts_trajectories_v2/combined_all/step_masks_v2.json"
sr_path: "checkpoints/mcts_trajectories_v2/combined_all/mcts_success.jsonl"
max_length: 12000
limit_images: 3

# ---- Weighting ----
beta: 0.5                     # Power exponent. 0=task-uniform, 0.5=sqrt, 1.0=linear Prop2Diff
max_step_ratio: 2.0           # Cap per-step weight at 2x mean (prevents overfitting on very-hard tasks)

# ---- Training ----
output_dir: "checkpoints/mcts_sft_v2.1/beta05_2e-6"
num_epochs: 1
per_device_batch_size: 1
gradient_accumulation_steps: 4    # effective_batch = 32 (1 × 4 × 8 GPUs)
learning_rate: 2e-6
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
logging_steps: 1

# ---- Infrastructure ----
fsdp_offload: false
