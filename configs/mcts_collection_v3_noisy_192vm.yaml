# MCTS v3 Noisy Collection — 86 tasks, 192 VMs (4×48), 8 GPUs
#
# Changes from v2 (clean):
#   - 192 VMs across 4 clusters (48 each)
#   - Per-branch random noise (NOT CRN — each branch gets unique seed)
#   - Noise-free replay (noise starts only from branch point onwards)
#   - Fire count adaptive to task SR:
#       SR < 0.15  → 0 fires (protect very hard tasks)
#       SR 0.15–0.60 → 1 fire (any element, feasibility-constrained)
#       SR > 0.60  → 2 fires (sequential, non-overlapping)
#   - No tier cap — feasibility constraint ensures recovery is always possible
#   - 80% noisy branches, 20% clean controls
#   - Full tree saving (same format as v2, with noise metadata)
#
# Usage:
#   python scripts/mcts/run_mcts_collection.py \
#       --config configs/mcts_collection_v3_noisy_192vm.yaml
#
#   Resume:
#   python scripts/mcts/run_mcts_collection.py \
#       --config configs/mcts_collection_v3_noisy_192vm.yaml --resume

# ---- VMs (192 total: 4 × 48) ----
vms_per_task: 192
max_active_vms: 192
tasks_per_batch: 1

# ---- Env servers ----
remote_server_urls:
  - "http://10.100.4.4:15001"
  - "http://10.100.4.6:15001"
  - "http://10.100.4.8:15001"
  - "http://10.100.4.7:15001"
remote_server_env_counts: [48, 48, 48, 48]

# ---- Probing ----
probe_temperature: 1.0
total_probe_budget: 160
k_max: 48

# ---- Branching ----
spatial_grid_size: 50
min_cluster_size: 1
max_branch_per_explorer: 4
child_branch_budget: 4
max_branches_per_step: 2
never_branch_after: 13
late_step_threshold: 10

# ---- Replay ----
replay_pause_sec: 1.0

# ---- Pruning ----
stuck_repeat_limit: 3
stuck_wait_limit: 2

# ---- Pipeline ----
max_steps: 15

# ---- GPU / Inference ----
model_path: "checkpoints/mcts_sft_v2.1/beta05_2e-6/epoch_1"
tp: 8
gpu_memory_utilization: 0.85
max_model_len: 12000
limit_images: 3
generation_max_tokens: 512

# ---- Tree saving (v2 format + noise metadata) ----
save_full_tree: true

# ---- Task file ----
task_file: "OSWorld/evaluation_examples/test_86tasks_trainable.json"

# ---- Output ----
output_dir: "checkpoints/mcts_trajectories_v3_noisy"

# ---- Noise (v3: per-branch random noise) ----
enable_noise: true
noise_mode: "runtime_library"
noise_branch_probability: 0.8
noise_min_fire_step: 3
noise_min_task_buffer: 4
noise_sr_file: "checkpoints/mcts_trajectories_v2/combined_all/collection_results.json"
