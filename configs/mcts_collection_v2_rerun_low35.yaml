# MCTS v2 Rerun — 35 low-success tasks (<=15 successes in base_86 run)
#
# Same parameters as base_86 run. Goal: collect more trees for hard tasks.
#
# Usage:
#   sudo -E python scripts/mcts/run_mcts_collection.py \
#       --config configs/mcts_collection_v2_rerun_low35.yaml

# ---- VMs (112 total: 32 + 16 + 32 + 32) ----
vms_per_task: 112
max_active_vms: 112
tasks_per_batch: 1

# ---- Env servers ----
remote_server_urls:
  - "http://10.100.4.4:15001"
  - "http://10.100.4.6:15001"
  - "http://10.100.4.8:15001"
  - "http://10.100.4.7:15001"
remote_server_env_counts: [32, 16, 32, 32]

# ---- Probing ----
probe_temperature: 1.0
total_probe_budget: 96
k_max: 64

# ---- Branching ----
spatial_grid_size: 50
min_cluster_size: 1
max_branch_per_explorer: 4
child_branch_budget: 4
max_branches_per_step: 2
never_branch_after: 15
late_step_threshold: 10

# ---- Replay ----
replay_pause_sec: 1.0

# ---- Pruning ----
stuck_repeat_limit: 3
stuck_wait_limit: 2

# ---- Pipeline ----
max_steps: 15

# ---- GPU / Inference ----
model_path: "ByteDance-Seed/UI-TARS-1.5-7B"
tp: 8
gpu_memory_utilization: 0.85
max_model_len: 12000
limit_images: 3
generation_max_tokens: 512

# ---- Tree saving (v2) ----
save_full_tree: true

# ---- Task file ----
task_file: "OSWorld/evaluation_examples/test_35tasks_low_success.json"

# ---- Output ----
output_dir: "checkpoints/mcts_trajectories_v2/rerun_low35"
