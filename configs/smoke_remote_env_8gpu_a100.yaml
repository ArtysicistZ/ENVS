# ARPO Smoke Test - 8x A100 80G + Remote AWS Env
# Aligned with upstream JIA-Lab ARPO (osworld_full_arpo.sh) adapted for 1-node 8-GPU.
#
# Key design choices vs 2-node 16-GPU upstream:
#   - tensor_parallel_size=1 → 8 independent vLLM engines (same per-GPU profile as upstream)
#   - ulysses_sequence_parallel_size=1 → no sequence split (upstream uses 1)
#   - global_batch_size=4 (upstream 8) → halved for 1 node
#   - gpu_memory_utilization=0.6 → upstream value; gives generous KV cache headroom
#
# Prerequisites:
#   1) AWS env server running: curl http://YOUR_AWS_IP:15001/health
#   2) Run: python -m verl.trainer.main config=configs/smoke_remote_env_8gpu_a100.yaml

data:
  train_files: OSWorld/evaluation_examples/test_smoke_4.json
  val_files: OSWorld/evaluation_examples/test_smoke_4.json
  prompt_key: instruction
  answer_key: ""
  image_key: images
  max_prompt_length: 64000
  max_response_length: 1024
  rollout_batch_size: 1
  val_batch_size: -1
  shuffle: true
  seed: 1
  max_pixels: 2116800
  min_pixels: 256

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0
  enable_replay: true

worker:
  actor:
    global_batch_size: 4
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    # ulysses_sequence_parallel_size=1: no sequence split, matches upstream default.
    # UI-TARS-1.5-7B: 28 attn heads / 4 KV heads — can support up to sp=4 when flash-attn is
    # stable; leave at 1 for now to eliminate any residual memory overhead.
    ulysses_sequence_parallel_size: 1
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: ByteDance-Seed/UI-TARS-1.5-7B
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: false
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    temperature: 1.0
    n: 2
    # 0.6 = upstream value. With TP=1 and 7B model (~14 GB), each GPU has ~66 GB free;
    # 60% → ~39 GB KV cache per engine — enough for several 72K-token sequences in parallel.
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    # TP=1: each GPU runs its own full vLLM engine (8 independent engines).
    # Same per-GPU memory profile as upstream's 16-engine 2-node setup.
    tensor_parallel_size: 1
    limit_images: 15
    max_num_batched_tokens: 128000
    max_num_seqs: 1
    # "recompute" = upstream behavior: logprobs computed by actor forward pass, not vLLM.
    # "auto" enables prompt_logprobs=1 in vLLM, which computes logits for ALL prompt tokens
    # (~52K × 152K vocab = ~30 GB peak) — OOMs on 8-GPU where FSDP overhead is 2× larger.
    old_logprob_source: "recompute"
    val_override_config:
      temperature: 0.5
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 1
  max_steps: 15
  remote_server_url: "http://10.100.4.7:15001"

trainer:
  total_episodes: 10
  logger: ["console", "wandb"]
  project_name: arpo-smoke-test
  experiment_name: uitars_7b_8xa100_remote_smoke
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: false
