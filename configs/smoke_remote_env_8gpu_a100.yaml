# ARPO Safe Smoke Test - 8x A100 80G + Remote AWS Env
# This is a low-risk correctness profile for 1 remote env.
# It intentionally keeps rollout conservative to avoid the 78G-per-GPU peak
# caused by using a throughput-oriented rollout topology in a smoke run.
#
# 1) Ensure AWS env server is running: curl http://YOUR_AWS_IP:15001/health
# 2) Run: python -m verl.trainer.main config=configs/smoke_remote_env_8gpu_a100.yaml

data:
  train_files: OSWorld/evaluation_examples/test_smoke_4.json
  val_files: OSWorld/evaluation_examples/test_smoke_4.json
  prompt_key: instruction
  answer_key: ""
  image_key: images
  max_prompt_length: 64000
  max_response_length: 1024
  rollout_batch_size: 1
  val_batch_size: -1
  shuffle: true
  seed: 1
  max_pixels: 2116800
  min_pixels: 256

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0
  enable_replay: true

worker:
  actor:
    global_batch_size: 4
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true   # required for ulysses sequence parallelism
    # UI-TARS-1.5-7B has 28 attention heads / 4 KV heads, so the current Ulysses path can split
    # the sequence across at most 4 ranks. On 8 GPUs, this yields 2 data-parallel groups of 4.
    ulysses_sequence_parallel_size: 4
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: ByteDance-Seed/UI-TARS-1.5-7B
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: false
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: true

  rollout:
    temperature: 1.0
    n: 2
    gpu_memory_utilization: 0.4
    enforce_eager: false
    enable_chunked_prefill: false
    # Safe 1-env smoke profile: keep rollout split across 4 GPUs to reduce per-GPU KV pressure.
    tensor_parallel_size: 4
    limit_images: 15
    max_num_batched_tokens: 65536
    max_num_seqs: 1
    val_override_config:
      temperature: 0.5
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 1
  max_steps: 15
  remote_server_url: "http://98.89.25.166:15001"

trainer:
  total_episodes: 10
  logger: ["console", "wandb"]
  project_name: arpo-smoke-test
  experiment_name: uitars_7b_8xa100_remote_safe_smoke
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: false
