# ARPO Smoke Test - 2×8 A100 80G (16 GPUs) + Remote AWS Env
# Matches upstream JIA-Lab ARPO (osworld_full_arpo.sh) 2-node setup.
#
# Key differences vs 8-GPU config:
#   - nnodes=2 → 16 GPUs across 2 VMs
#   - global_batch_size=8 → upstream value (double of 8-GPU's 4)
#   - gpu_memory_utilization=0.6 → upstream value (FSDP shards halved = more headroom)
#   - max_num_batched_tokens=128000 → upstream value
#
# Prerequisites:
#   1) Ray cluster: head node `ray start --head --num-gpus=8`
#                   worker node `ray start --address=<HEAD_IP>:6379 --num-gpus=8`
#   2) AWS env server running: curl http://YOUR_AWS_IP:15001/health
#   3) Run on head node: python -m verl.trainer.main config=configs/smoke_remote_env_16gpu_a100.yaml

data:
  train_files: OSWorld/evaluation_examples/test_smoke_4.json
  val_files: OSWorld/evaluation_examples/test_smoke_4.json
  prompt_key: instruction
  answer_key: ""
  image_key: images
  max_prompt_length: 64000
  max_response_length: 1024
  rollout_batch_size: 1
  val_batch_size: -1
  shuffle: true
  seed: 1
  max_pixels: 2116800
  min_pixels: 256

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0
  enable_replay: true

worker:
  actor:
    global_batch_size: 8
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: ByteDance-Seed/UI-TARS-1.5-7B
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: false
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    temperature: 1.0
    n: 2
    # With 16 GPUs, FSDP shards are half the size (~0.875 GiB model + ~1.75 GiB optimizer
    # per GPU vs ~1.75 + ~3.5 on 8 GPUs). This leaves ~3.5 GiB more headroom per GPU,
    # so upstream's 0.6 is safe here.
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 15
    max_num_batched_tokens: 128000
    max_num_seqs: 1
    old_logprob_source: "recompute"
    val_override_config:
      temperature: 0.5
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 1
  max_steps: 15
  remote_server_url: "http://10.100.4.7:15001"

trainer:
  total_episodes: 10
  logger: ["console", "wandb"]
  project_name: arpo-smoke-test
  experiment_name: uitars_7b_16xa100_remote_smoke
  n_gpus_per_node: 8
  nnodes: 2
  val_before_train: false