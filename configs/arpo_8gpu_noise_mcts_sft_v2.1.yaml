# ARPO + v4 Noise from MCTS SFT v2.1 checkpoint — 8x A100-80GB + 96 Remote Envs
#
# Base model: MCTS SFT v2.1 (beta05_2e-6, epoch_1)
# Topology: 2 env_servers × 48 slots each = 96 envs.
#   10.100.4.4:15001 (slots 0-47)
#   10.100.4.7:15001 (slots 0-47)
#
# Run: bash scripts/training/run_arpo_noise_mcts_sft_v2.1.sh

data:
  train_files: OSWorld/evaluation_examples/test_86tasks_trainable.json
  val_files: OSWorld/evaluation_examples/test_86tasks_trainable.json
  prompt_key: instruction
  answer_key: ""
  image_key: images
  max_prompt_length: 12000
  max_response_length: 1024
  rollout_batch_size: 12
  val_batch_size: -1
  shuffle: true
  seed: 42
  max_pixels: 2116800
  min_pixels: 256

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_coef: 0
  enable_replay: true
  # ─── v4 noise ───────────────────────────────────────────────────────────
  enable_noise: true
  noise_mode: runtime_library
  noise_probability: 0.10
  noise_probability_min: 0.0
  noise_probability_max: 0.20
  noise_initial_tier: 2
  noise_use_curriculum: true
  noise_target_sr: 0.5
  noise_tau_up: 0.6
  noise_tau_down: 0.15
  noise_k_up: 3
  noise_ema_alpha: 0.3
  noise_recovery_ema_alpha: 0.2
  noise_lr: 0.05
  noise_tier_min: 0
  noise_tier_max: 5
  noise_use_heldout: false

worker:
  actor:
    global_batch_size: 12
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 2
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: checkpoints/mcts_sft_v2.1/beta05_2e-6/epoch_1
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: false
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    temperature: 1.0
    n: 8
    gpu_memory_utilization: 0.4
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 3
    max_num_batched_tokens: 13024
    max_num_seqs: 8
    old_logprob_source: "recompute"
    val_override_config:
      temperature: 0.5
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 96
  max_steps: 15
  remote_server_urls:
    - "http://10.100.4.4:15001"
    - "http://10.100.4.7:15001"
  remote_server_env_counts: [48, 48]

trainer:
  total_episodes: 20
  logger: ["console", "wandb"]
  project_name: OSWorld-ARPO
  experiment_name: arpo_mcts_sft_v2.1_v4_noise_8xa100
  wandb_entity: artysicistz-university-of-pennsylvania
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: false
  val_freq: 5
  save_freq: 5
  save_limit: 3
